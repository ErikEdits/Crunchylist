<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Watchlog — Anime Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand-row">
      <div class="brand">Watchlog<span class="dot">.</span></div>
      <div class="ticker">
        <span><b id="stat-series">0</b> Anime</span>
        <span class="sep">/</span>
        <span><b id="stat-episodes">0</b> Episoden</span>
        <span class="sep">/</span>
        <span><b id="stat-hours">0</b> Std. geschaut</span>
        <span class="sep">/</span>
        <span>Stand: <b id="stat-updated">-</b></span>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="watchlist">Watchlist</button>
      <button class="tab-btn" data-tab="history">Verlauf</button>
    </div>
  </div>
</header>

<div class="controls">
  <div class="search-box">
    <input id="search" type="text" placeholder="Anime suchen..." />
  </div>
  <select id="sort">
    <option value="title">A–Z</option>
    <option value="recent">Zuletzt geschaut</option>
    <option value="episodes">Meiste Episoden</option>
  </select>
  <span class="count-pill" id="count-pill"></span>
  <span class="count-pill" id="cover-progress" style="display:none"></span>
  <button class="load-more" id="retry-covers" style="margin:0;padding:8px 14px;font-size:12px;">Fehlende Cover erneut laden</button>
</div>

<main>
  <section id="view-watchlist" class="view active">
    <div class="grid" id="grid"></div>
  </section>

  <section id="view-history" class="view">
    <div id="history-list"></div>
    <button class="load-more" id="load-more">Mehr laden</button>
  </section>
</main>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal-body"></div>
</div>

<footer class="foot">Watchlog — lokal generiert aus deinem Export. Cover-Bilder via Jikan API (MyAnimeList), einmalig geladen &amp; gecacht.</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
